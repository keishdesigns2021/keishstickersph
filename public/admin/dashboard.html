<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Keish Stickers & Apparel PH</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-shell">
    <div class="admin-topbar">
      <div class="container">
        <div class="logo" style="color: var(--white);"><span class="blob"></span> Admin Dashboard</div>
        <div style="display:flex; align-items:center; gap:16px;">
          <span id="whoami" style="font-size: 0.85rem; color: rgba(255,255,255,0.7);"></span>
          <a href="/" class="btn btn-outline btn-sm" style="border-color: white; color: white;">View Site</a>
          <button id="logout-btn" class="btn btn-danger btn-sm">Log Out</button>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="products">Products</button>
        <button class="admin-tab" data-tab="services">Services</button>
        <button class="admin-tab" data-tab="inquiries">Inquiries <span id="inquiry-count" class="badge unread" style="display:none;"></span></button>
        <button class="admin-tab" data-tab="settings">Site Settings</button>
      </div>

      <div class="admin-panel active" id="panel-products">
        <div class="admin-grid">
          <div class="form-card">
            <h3 id="product-form-title">Add Product</h3>
            <div id="product-form-message" class="form-message"></div>
            <form id="product-form">
              <input type="hidden" id="product-id" name="id">
              <div class="field">
                <label for="p-name">Name</label>
                <input type="text" id="p-name" name="name" required>
              </div>
              <div class="field">
                <label for="p-category">Category</label>
                <input type="text" id="p-category" name="category" list="category-suggestions" placeholder="e.g. Stickers, Apparel, Keychains…" required>
                <datalist id="category-suggestions"></datalist>
              </div>
              <div class="field">
                <label for="p-price">Price (₱)</label>
                <input type="number" id="p-price" name="price" min="0" step="0.01" required>
              </div>
              <div class="field">
                <label for="p-description">Description</label>
                <textarea id="p-description" name="description"></textarea>
              </div>
              <div class="field">
                <label for="p-image">Photo (optional)</label>
                <input type="file" id="p-image" name="image" accept="image/png, image/jpeg, image/webp, image/gif">
              </div>
              <div class="field checkbox-field">
                <input type="checkbox" id="p-featured" name="featured">
                <label for="p-featured" style="margin: 0;">Feature on homepage</label>
              </div>
              <div style="display:flex; gap: 10px;">
                <button type="submit" class="btn btn-primary" id="product-submit-btn">Add Product</button>
                <button type="button" class="btn btn-outline" id="product-cancel-btn" style="display:none;">Cancel</button>
              </div>
            </form>
          </div>

          <div>
            <table class="admin-table">
              <thead>
                <tr>
                  <th></th>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th></th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="product-rows">
                <tr><td colspan="6">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="admin-panel" id="panel-services">
        <div class="admin-grid">
          <div class="form-card">
            <h3 id="service-form-title">Add Service</h3>
            <div id="service-form-message" class="form-message"></div>
            <form id="service-form">
              <input type="hidden" id="s-id" name="id">
              <div class="field">
                <label for="s-name">Name</label>
                <input type="text" id="s-name" name="name" required>
              </div>
              <div class="field">
                <label for="s-price">Price (optional, free text — e.g. "Starts at ₱200")</label>
                <input type="text" id="s-price" name="price">
              </div>
              <div class="field">
                <label for="s-description">Description</label>
                <textarea id="s-description" name="description"></textarea>
              </div>
              <div class="field">
                <label for="s-image">Photo (optional)</label>
                <input type="file" id="s-image" name="image" accept="image/png, image/jpeg, image/webp, image/gif">
              </div>
              <div style="display:flex; gap: 10px;">
                <button type="submit" class="btn btn-primary" id="service-submit-btn">Add Service</button>
                <button type="button" class="btn btn-outline" id="service-cancel-btn" style="display:none;">Cancel</button>
              </div>
            </form>
          </div>

          <div>
            <table class="admin-table">
              <thead>
                <tr>
                  <th></th>
                  <th>Name</th>
                  <th>Price</th>
                  <th></th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="service-rows">
                <tr><td colspan="5">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="admin-panel" id="panel-settings">
        <div class="form-card" style="max-width: 560px;">
          <h3>Site Settings</h3>
          <div id="settings-form-message" class="form-message"></div>
          <form id="settings-form">
            <div class="field">
              <label for="set-logo">Website Logo</label>
              <img id="logo-preview" src="" alt="" style="display:none; width:60px; height:60px; border-radius:50%; object-fit:cover; margin-bottom:10px;">
              <input type="file" id="set-logo" name="logo" accept="image/png, image/jpeg, image/webp, image/gif">
              <label class="checkbox-field" style="margin-top: 10px;">
                <input type="checkbox" id="set-clear-logo" name="clearLogo">
                <span>Remove current logo (use default icon)</span>
              </label>
            </div>
            <div class="field">
              <label for="set-catalog-tag">Catalog Page — Small Label</label>
              <input type="text" id="set-catalog-tag" name="catalogTag">
            </div>
            <div class="field">
              <label for="set-catalog-heading">Catalog Page — Heading</label>
              <input type="text" id="set-catalog-heading" name="catalogHeading">
            </div>
            <div class="field">
              <label for="set-catalog-description">Catalog Page — Description</label>
              <textarea id="set-catalog-description" name="catalogDescription"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Settings</button>
          </form>
        </div>
      </div>

      <div class="admin-panel" id="panel-inquiries">
        <table class="admin-table">
          <thead>
            <tr>
              <th>From</th>
              <th>Contact</th>
              <th>Message</th>
              <th>Date</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="inquiry-rows">
            <tr><td colspan="5">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="/admin/admin.js"></script>
</body>
</html>
